name: Build preview APK

on:
  push:
    branches: [ci/apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch packages
        run: flutter pub get

      # android/app/build.gradle pins this NDK; Gradle cannot install it on its
      # own because the runner has not accepted the SDK licenses.
      - name: Install Android NDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;29.0.13113456" > /dev/null

      # Profile builds are signed with the debug key, so the APK installs
      # without the release keystore (which must not live in the repo).
      # On failure the tail of the log is copied into an annotation, which is
      # readable through the public API without signing in.
      - name: Build APK
        shell: bash
        run: |
          set +e
          flutter build apk --profile 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(grep -v "available)" build.log | tail -n 45 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build log tail::${msg}"
          fi
          exit "$status"

      - uses: actions/upload-artifact@v4
        with:
          name: arabic-names-preview-apk
          path: build/app/outputs/flutter-apk/app-profile.apk
          if-no-files-found: error

      # Production bundle (.aab). It is signed with the upload key kept in these
      # repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      - name: Check release signing secrets
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release signing files
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      # Without the production key, build with a throwaway one. This only proves
      # the release build (R8 shrinking included) works; the result is not uploaded.
      - name: Write throwaway signing files
        if: steps.signing.outputs.available != 'true'
        shell: bash
        run: |
          keytool -genkeypair -keystore android/app/release.jks -storepass throwaway \
            -keypass throwaway -alias throwaway -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=CI check only"
          printf 'storePassword=throwaway\nkeyPassword=throwaway\nkeyAlias=throwaway\nstoreFile=release.jks\n' \
            > android/key.properties

      - name: Build release AAB
        shell: bash
        run: |
          set +e
          flutter build appbundle --release 2>&1 | tee aab.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(grep -v "available)" aab.log | tail -n 45 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=AAB log tail::${msg}"
          fi
          exit "$status"

      - name: Upload production AAB
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: arabic-names-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Explain missing production key
        if: steps.signing.outputs.available != 'true'
        run: echo "::notice title=No production AAB::The release build works, but no AAB was uploaded. Add the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets, then rerun."
