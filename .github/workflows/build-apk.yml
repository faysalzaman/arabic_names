name: Build preview APK

on:
  push:
    branches: [ci/apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch packages
        run: flutter pub get

      # Profile builds are signed with the debug key, so the APK installs
      # without the release keystore (which must not live in the repo).
      - name: Build APK
        run: flutter build apk --profile

      - uses: actions/upload-artifact@v4
        with:
          name: arabic-names-preview-apk
          path: build/app/outputs/flutter-apk/app-profile.apk
          if-no-files-found: error
